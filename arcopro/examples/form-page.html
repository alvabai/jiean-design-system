<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新建记录 · arcopro 参考实现</title>
<link rel="stylesheet" href="../dist/tokens.full.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="shell__header">
  <div class="brand">
    <svg class="brand__mark" viewBox="0 0 28 28" aria-hidden="true">
      <circle cx="9" cy="14" r="8" fill="var(--color-primary)"></circle>
      <path d="M17 6h4a5 5 0 0 1 0 10h-4z" fill="var(--color-primary-hover)"></path>
      <path d="M14 16h7a5 5 0 0 1-5 6h-2z" fill="var(--color-primary-active)"></path>
    </svg>
    <span class="brand__name">捷安中台</span>
  </div>
  <div class="header-tools">
    <div class="header-search">
      <input type="search" placeholder="搜索…" aria-label="搜索">
    </div>
    <button class="icon-button" type="button" aria-label="通知"><span class="icon-button__dot"></span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 7a4 4 0 0 1 8 0v3l1 2H3l1-2z"></path><path d="M6.5 12.5a1.6 1.6 0 0 0 3 0"></path></svg>
    </button>
    <button class="icon-button" type="button" aria-label="设置">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.6v1.7M8 12.7v1.7M1.6 8h1.7M12.7 8h1.7M3.5 3.5l1.2 1.2M11.3 11.3l1.2 1.2M12.5 3.5l-1.2 1.2M4.7 11.3l-1.2 1.2"></path></svg>
    </button>
    <div class="avatar" title="白晓亮">白</div>
  </div>
</header>

<aside class="shell__sidebar">
  <nav class="sidebar__scroll" aria-label="主导航">
    <a class="menu-item" href="dashboard.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="1.5" y="1.5" width="5" height="5"></rect><rect x="9.5" y="1.5" width="5" height="5"></rect><rect x="1.5" y="9.5" width="5" height="5"></rect><rect x="9.5" y="9.5" width="5" height="5"></rect></svg>工作台
    </a>
    <a class="menu-item" href="list-page.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M1.5 4h13M1.5 8h13M1.5 12h13"></path><circle cx="3" cy="4" r="1"></circle></svg>记录列表
    </a>
    <a class="menu-item menu-item--selected" href="form-page.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="1.5" width="12" height="13" rx="0.5"></rect><path d="M4.5 5.5h7M4.5 8.5h7M4.5 11.5h4"></path></svg>新建记录
    </a>
    <a class="menu-item" href="detail-page.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="5" r="2.6"></circle><path d="M2.8 13.5a5.2 5.2 0 0 1 10.4 0"></path></svg>记录详情
    </a>
    <div class="menu-group">
      <div class="menu-group__label">设计系统</div>
      <a class="menu-item" href="components.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M8 1.8 14.2 5 8 8.2 1.8 5z"></path><path d="M1.8 8 8 11.2 14.2 8"></path><path d="M1.8 11 8 14.2 14.2 11"></path></svg>组件总览
      </a>
      <a class="menu-item" href="index.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 3.5h12v10H2z"></path><path d="M2 6.5h12M5.5 6.5v7"></path></svg>规范索引
      </a>
    </div>
  </nav>
</aside>

<main class="shell__content">
  <!-- 表单页为底部固定操作条预留高度，避免遮挡最后一个分组 -->
  <div class="shell__content-inner" style="padding-bottom:90px">

    <nav class="breadcrumb" aria-label="面包屑">
      <a class="breadcrumb__home" href="index.html" aria-label="首页">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 7 8 2l6 5v6.5H2z"></path></svg>
      </a>
      <span class="breadcrumb__sep">/</span>
      <span>记录</span>
      <span class="breadcrumb__sep">/</span>
      <span class="breadcrumb__current">新建记录</span>
    </nav>

    <form class="stack" onsubmit="return false">

      <section class="card">
        <h2 class="card__title">基础信息</h2>
        <div class="form-grid">
          <div class="field">
            <label class="field__label" for="g-name">名称</label>
            <input class="input" id="g-name" placeholder="请输入名称">
          </div>
          <div class="field">
            <label class="field__label" for="g-type">类型</label>
            <select class="select select--placeholder" id="g-type">
              <option>请选择</option><option>周期性</option><option>一次性</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label" for="g-owner">负责人</label>
            <select class="select select--placeholder" id="g-owner">
              <option>请选择</option><option>白晓亮</option><option>高志生</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label" for="g-org">所属部门</label>
            <input class="input" id="g-org" placeholder="请输入部门">
          </div>
          <div class="field">
            <label class="field__label" for="g-start">开始日期</label>
            <input class="input" id="g-start" placeholder="请选择日期">
          </div>
          <div class="field">
            <label class="field__label" for="g-end">结束日期</label>
            <input class="input" id="g-end" placeholder="请选择日期">
          </div>
        </div>
      </section>

      <section class="card">
        <h2 class="card__title">执行参数</h2>
        <div class="form-grid">
          <div class="field">
            <label class="field__label" for="p-mode">执行方式</label>
            <select class="select select--placeholder" id="p-mode">
              <option>请选择</option><option>自动</option><option>人工</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label" for="p-batch">批次大小（1–500）</label>
            <input class="input" id="p-batch" placeholder="请输入 1–500 之间的整数">
          </div>
          <div class="field">
            <label class="field__label" for="p-retry">重试次数（0–5）</label>
            <input class="input" id="p-retry" placeholder="请输入 0–5 之间的整数">
          </div>
          <div class="field">
            <label class="field__label" for="p-timeout">单次超时（秒）</label>
            <input class="input" id="p-timeout" placeholder="请输入超时时间">
          </div>
          <div class="field">
            <label class="field__label" for="p-priority">优先级</label>
            <select class="select select--placeholder" id="p-priority">
              <option>请选择</option><option>高</option><option>中</option><option>低</option>
            </select>
          </div>
          <div class="field">
            <span class="field__label">完成通知</span>
            <div class="spec-row" style="height:32px">
              <span class="checkbox"><span class="checkbox__box checkbox__box--checked"></span>站内信</span>
              <span class="checkbox"><span class="checkbox__box"></span>邮件</span>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2 class="card__title">说明</h2>
        <div class="field">
          <label class="field__label" for="g-note">备注</label>
          <textarea class="textarea" id="g-note" rows="3" placeholder="请输入备注，最多 200 字"></textarea>
          <span class="field__hint">该说明仅用于内部流转，不会出现在对外报表中。</span>
        </div>
      </section>

      <p class="page-footer" style="padding-top:0">
        本页为 <b>arcopro</b> 参考实现：字段与提示文字为布局示例（sample data）。
        分组表单与固定操作条的规则见 <a href="../docs/forms.md">docs/forms.md</a>。
      </p>
    </form>
  </div>

  <div class="form-actions">
    <button class="btn btn--primary btn--lg" type="submit">提交</button>
    <button class="btn btn--secondary btn--lg" type="reset">重置</button>
  </div>
</main>

</body>
</html>
